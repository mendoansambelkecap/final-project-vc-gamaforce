name: Lint

on:
  push:
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - '*.png'
      - '**/*.png'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - '*.png'
      - '**/*.png'
      - '.gitignore'

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:

      # di bawah ini kita pin version nya sampai ke level commit hash agar benar-benar reproducible
      # terkadang minor/patch change dapat mendatangkan unexpected bug/change

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
       

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: '3.12'
          version: "0.13.9"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint with Ruff
        run: uv run --frozen ruff check .
